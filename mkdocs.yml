site_name: Creative Writing 10
site_description: Readings and syllabus for class

theme:
  name: material
  features:
    - navigation.sections        # Groups items into distinct sections
    - navigation.indexes         # Makes section headers clickable pages (Optional)
    # Note: Do NOT include 'navigation.expand' here, as that forces everything open!
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.sections
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Syllabus:
      - Course Info: intro.md
      - Sample: index.md

