site_name: Creative Writing 10
site_description: Readings and syllabus for class

plugins:
  - search    # Only keep search, no extra pip plugins needed!

theme:
  name: material
  custom_dir: overrides
  font:
    text: "Source Serif 4"
    code: "Roboto Mono"
  icon:
    logo: material/cat
    favicon: material/cat
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Syllabus:
      - Course Info: intro.md
      - Sample: index.md
