site_name: Creative Writing 10
site_description: Readings and syllabus for class

theme:
  name: material
  features:
    - navigation.sections   # Displays group headings in bold, distinct typography
    - navigation.expand     # Keeps all nested items expanded so nothing is hidden
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.sections
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Syllabus:
      - Course Info: intro.md
      - Sample: index.md

